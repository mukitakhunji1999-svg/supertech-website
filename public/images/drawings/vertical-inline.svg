<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" role="img" aria-label="Vertical inline multi-stage pump">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="gMotor" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#0f6cbd"/><stop offset="100%" stop-color="#062a4d"/></linearGradient>
    <linearGradient id="gPump" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#1bb6e6"/><stop offset="100%" stop-color="#0f6cbd"/></linearGradient>
  </defs>
  <rect width="360" height="720" fill="url(#g1)"/>

  <g fill="none" stroke="#0a4277" stroke-width="2.5">
    <!-- Motor (top) -->
    <rect x="100" y="40" width="160" height="160" rx="14"/>
    <!-- Cooling fins -->
    <line x1="115" y1="55" x2="115" y2="185"/>
    <line x1="135" y1="55" x2="135" y2="185"/>
    <line x1="155" y1="55" x2="155" y2="185"/>
    <line x1="175" y1="55" x2="175" y2="185"/>
    <line x1="195" y1="55" x2="195" y2="185"/>
    <line x1="215" y1="55" x2="215" y2="185"/>
    <line x1="235" y1="55" x2="235" y2="185"/>
    <line x1="245" y1="55" x2="245" y2="185"/>
    <!-- Terminal box -->
    <rect x="265" y="80" width="40" height="50" rx="3"/>

    <!-- Spacer coupling housing -->
    <rect x="120" y="200" width="120" height="40" rx="6"/>
    <rect x="135" y="240" width="90" height="20" rx="2"/>

    <!-- Pump section (multiple stages) -->
    <rect x="110" y="260" width="140" height="380" rx="10"/>
    <line x1="110" y1="300" x2="250" y2="300"/>
    <line x1="110" y1="340" x2="250" y2="340"/>
    <line x1="110" y1="380" x2="250" y2="380"/>
    <line x1="110" y1="420" x2="250" y2="420"/>
    <line x1="110" y1="460" x2="250" y2="460"/>
    <line x1="110" y1="500" x2="250" y2="500"/>
    <line x1="110" y1="540" x2="250" y2="540"/>
    <line x1="110" y1="580" x2="250" y2="580"/>
    <line x1="180" y1="260" x2="180" y2="640" stroke-dasharray="3 3"/>

    <!-- Foot / base -->
    <rect x="90" y="640" width="180" height="40" rx="6"/>
  </g>

  <rect x="103" y="263" width="154" height="374" rx="8" fill="url(#gPump)" opacity="0.14"/>
  <rect x="103" y="43" width="154" height="154" rx="12" fill="url(#gMotor)" opacity="0.16"/>

  <!-- Suction (left, horizontal port on foot) -->
  <line x1="60" y1="650" x2="90" y2="650" stroke="#0a4277" stroke-width="6"/>
  <rect x="40" y="640" width="20" height="20" rx="2" stroke="#0a4277" stroke-width="2" fill="white"/>

  <!-- Delivery (right, horizontal port on foot) -->
  <line x1="270" y1="650" x2="300" y2="650" stroke="#0a4277" stroke-width="6"/>
  <rect x="300" y="640" width="20" height="20" rx="2" stroke="#0a4277" stroke-width="2" fill="white"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0a4277">
    <text x="20" y="115">Motor</text>
    <text x="20" y="130" font-size="10" fill="#475569">(IEC frame)</text>
    <text x="270" y="110">Terminal</text>
    <text x="270" y="125">box</text>
    <text x="270" y="225">Coupling</text>
    <text x="270" y="240" font-size="10" fill="#475569">(spacer)</text>
    <text x="270" y="400">Pump stages</text>
    <text x="270" y="415" font-size="10" fill="#475569">(SS hydraulics)</text>
    <text x="270" y="560">Cartridge seal</text>
    <text x="35" y="635" font-size="9">Suction</text>
    <text x="295" y="635" font-size="9">Delivery</text>
    <text x="180" y="700" text-anchor="middle" font-weight="700" font-size="12">SUPERTECH Vertical Inline Pump</text>
  </g>
</svg>
