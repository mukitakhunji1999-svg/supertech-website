<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" role="img" aria-label="Submersible flat cable cross-section">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
  </defs>
  <rect width="540" height="360" fill="url(#g1)"/>

  <!-- Cable cross-section (flat 3-core) -->
  <g stroke="#0a4277" stroke-width="2.5" fill="none">
    <!-- Outer sheath (rounded rectangle) -->
    <rect x="100" y="120" width="340" height="120" rx="60"/>
  </g>
  <rect x="102" y="122" width="336" height="116" rx="58" fill="#1e293b"/>

  <!-- 3 cores -->
  <g>
    <!-- Red core -->
    <circle cx="180" cy="180" r="42" fill="#ef4444" stroke="#0a4277" stroke-width="2"/>
    <circle cx="180" cy="180" r="28" fill="#ffffff" stroke="#0a4277" stroke-width="1.5"/>
    <circle cx="180" cy="180" r="20" fill="#b45309"/>
    <!-- Bundled strands -->
    <g fill="#fbbf24" stroke="#0a4277" stroke-width="0.5">
      <circle cx="174" cy="174" r="2.5"/>
      <circle cx="180" cy="172" r="2.5"/>
      <circle cx="186" cy="174" r="2.5"/>
      <circle cx="172" cy="180" r="2.5"/>
      <circle cx="178" cy="180" r="2.5"/>
      <circle cx="184" cy="180" r="2.5"/>
      <circle cx="190" cy="180" r="2.5"/>
      <circle cx="174" cy="186" r="2.5"/>
      <circle cx="180" cy="188" r="2.5"/>
      <circle cx="186" cy="186" r="2.5"/>
    </g>

    <!-- Yellow core -->
    <circle cx="270" cy="180" r="42" fill="#eab308" stroke="#0a4277" stroke-width="2"/>
    <circle cx="270" cy="180" r="28" fill="#ffffff" stroke="#0a4277" stroke-width="1.5"/>
    <circle cx="270" cy="180" r="20" fill="#b45309"/>
    <g fill="#fbbf24" stroke="#0a4277" stroke-width="0.5">
      <circle cx="264" cy="174" r="2.5"/>
      <circle cx="270" cy="172" r="2.5"/>
      <circle cx="276" cy="174" r="2.5"/>
      <circle cx="262" cy="180" r="2.5"/>
      <circle cx="268" cy="180" r="2.5"/>
      <circle cx="274" cy="180" r="2.5"/>
      <circle cx="280" cy="180" r="2.5"/>
      <circle cx="264" cy="186" r="2.5"/>
      <circle cx="270" cy="188" r="2.5"/>
      <circle cx="276" cy="186" r="2.5"/>
    </g>

    <!-- Blue core -->
    <circle cx="360" cy="180" r="42" fill="#3b82f6" stroke="#0a4277" stroke-width="2"/>
    <circle cx="360" cy="180" r="28" fill="#ffffff" stroke="#0a4277" stroke-width="1.5"/>
    <circle cx="360" cy="180" r="20" fill="#b45309"/>
    <g fill="#fbbf24" stroke="#0a4277" stroke-width="0.5">
      <circle cx="354" cy="174" r="2.5"/>
      <circle cx="360" cy="172" r="2.5"/>
      <circle cx="366" cy="174" r="2.5"/>
      <circle cx="352" cy="180" r="2.5"/>
      <circle cx="358" cy="180" r="2.5"/>
      <circle cx="364" cy="180" r="2.5"/>
      <circle cx="370" cy="180" r="2.5"/>
      <circle cx="354" cy="186" r="2.5"/>
      <circle cx="360" cy="188" r="2.5"/>
      <circle cx="366" cy="186" r="2.5"/>
    </g>
  </g>

  <!-- Labels -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#0a4277">
    <text x="180" y="80" text-anchor="middle" font-weight="600">R (Red)</text>
    <text x="270" y="80" text-anchor="middle" font-weight="600">Y (Yellow)</text>
    <text x="360" y="80" text-anchor="middle" font-weight="600">B (Blue)</text>
    <line x1="180" y1="85" x2="180" y2="135" stroke="#0a4277" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="270" y1="85" x2="270" y2="135" stroke="#0a4277" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="360" y1="85" x2="360" y2="135" stroke="#0a4277" stroke-width="1.5" stroke-dasharray="2 2"/>

    <text x="60" y="180" text-anchor="middle">PCP /</text>
    <text x="60" y="195" text-anchor="middle">heavy</text>
    <text x="60" y="210" text-anchor="middle">PVC</text>
    <text x="60" y="225" text-anchor="middle" font-size="10" fill="#475569">sheath</text>
    <line x1="80" y1="180" x2="110" y2="180" stroke="#0a4277" stroke-width="1.5"/>

    <text x="490" y="180" text-anchor="middle">EPR /</text>
    <text x="490" y="195" text-anchor="middle">XLPE</text>
    <text x="490" y="210" text-anchor="middle" font-size="10" fill="#475569">insulation</text>
    <line x1="430" y1="180" x2="465" y2="180" stroke="#0a4277" stroke-width="1.5"/>

    <text x="270" y="270" text-anchor="middle" font-size="11">Tinned annealed copper conductor (Class 5 flexible)</text>
    <text x="270" y="320" text-anchor="middle" font-weight="700" font-size="13">SUPERTECH Submersible Flat Cable (3-core)</text>
  </g>
</svg>
