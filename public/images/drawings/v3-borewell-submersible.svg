      <line x1="170" y1="365" x2="175" y2="375"/>
      <line x1="185" y1="365" x2="190" y2="375"/>
    </g>

    <rect x="138" y="385" width="44" height="15" rx="2"/>
    <rect x="115" y="405" width="90" height="260" rx="6"/>
    <rect x="120" y="668" width="80" height="22" rx="4"/>
  </g>

  <rect x="118" y="63" width="84" height="294" rx="3" fill="url(#gPump)" opacity="0.12"/>
  <rect x="118" y="408" width="84" height="254" rx="5" fill="url(#gMotor)" opacity="0.14"/>

  <line x1="160" y1="60" x2="160" y2="385" stroke="#0a4277" stroke-width="2.5" stroke-dasharray="3 3"/>
