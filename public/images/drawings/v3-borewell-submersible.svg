    <line x1="212" y1="583" x2="205" y2="585" stroke="#0a4277" stroke-width="1"/>

    <text x="215" y="680">Cable inlet</text>
    <line x1="212" y1="678" x2="200" y2="678" stroke="#0a4277" stroke-width="1"/>

    <text x="20" y="40" font-weight="700" font-size="12">V3</text>
    <text x="20" y="55" font-size="9" fill="#475569">75 / 80 mm (3")</text>
    <text x="20" y="68" font-size="9" fill="#475569">borewell</text>

    <text x="160" y="710" text-anchor="middle" font-weight="700" font-size="11">SUPERTECH V3 Series</text>
