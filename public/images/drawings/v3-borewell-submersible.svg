<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 720" role="img" aria-label="V3 borewell submersible pump set — schematic cross section">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
