    <rect x="115" y="60" width="90" height="300" rx="4"/>

    <line x1="115" y1="95" x2="205" y2="95"/>
    <line x1="115" y1="125" x2="205" y2="125"/>
    <line x1="115" y1="155" x2="205" y2="155"/>
    <line x1="115" y1="185" x2="205" y2="185"/>
    <line x1="115" y1="215" x2="205" y2="215"/>
    <line x1="115" y1="245" x2="205" y2="245"/>
    <line x1="115" y1="275" x2="205" y2="275"/>
    <line x1="115" y1="305" x2="205" y2="305"/>
    <line x1="115" y1="335" x2="205" y2="335"/>

