<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" role="img" aria-label="Armoured power cable cross-section">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
  </defs>
  <rect width="540" height="360" fill="url(#g1)"/>

  <!-- Outer sheath (black PVC) -->
  <circle cx="270" cy="180" r="130" fill="#1e293b" stroke="#0a4277" stroke-width="3"/>
  <!-- Armouring (galvanised steel wires) -->
  <circle cx="270" cy="180" r="115" fill="none" stroke="#94a3b8" stroke-width="14" stroke-dasharray="2 2"/>
  <!-- Inner sheath -->
  <circle cx="270" cy="180" r="100" fill="#1e293b" stroke="#0a4277" stroke-width="1.5"/>

  <!-- 4 cores: R Y B + Earth -->
  <!-- Red (top) -->
  <circle cx="270" cy="105" r="40" fill="#ef4444" stroke="#0a4277" stroke-width="2"/>
  <circle cx="270" cy="105" r="22" fill="#b45309"/>
  <g fill="#fbbf24"><circle cx="265" cy="100" r="2.5"/><circle cx="275" cy="100" r="2.5"/><circle cx="270" cy="95" r="2.5"/><circle cx="270" cy="105" r="2.5"/><circle cx="265" cy="110" r="2.5"/><circle cx="275" cy="110" r="2.5"/></g>
  <!-- Yellow (right) -->
  <circle cx="345" cy="180" r="40" fill="#eab308" stroke="#0a4277" stroke-width="2"/>
  <circle cx="345" cy="180" r="22" fill="#b45309"/>
  <g fill="#fbbf24"><circle cx="340" cy="175" r="2.5"/><circle cx="350" cy="175" r="2.5"/><circle cx="345" cy="170" r="2.5"/><circle cx="345" cy="180" r="2.5"/><circle cx="340" cy="185" r="2.5"/><circle cx="350" cy="185" r="2.5"/></g>
  <!-- Blue (bottom) -->
  <circle cx="270" cy="255" r="40" fill="#3b82f6" stroke="#0a4277" stroke-width="2"/>
  <circle cx="270" cy="255" r="22" fill="#b45309"/>
  <g fill="#fbbf24"><circle cx="265" cy="250" r="2.5"/><circle cx="275" cy="250" r="2.5"/><circle cx="270" cy="245" r="2.5"/><circle cx="270" cy="255" r="2.5"/><circle cx="265" cy="260" r="2.5"/><circle cx="275" cy="260" r="2.5"/></g>
  <!-- Earth (left, green/yellow) -->
  <circle cx="195" cy="180" r="40" fill="#22c55e" stroke="#0a4277" stroke-width="2"/>
  <circle cx="195" cy="180" r="22" fill="#b45309"/>
  <g fill="#fbbf24"><circle cx="190" cy="175" r="2.5"/><circle cx="200" cy="175" r="2.5"/><circle cx="195" cy="170" r="2.5"/><circle cx="195" cy="180" r="2.5"/><circle cx="190" cy="185" r="2.5"/><circle cx="200" cy="185" r="2.5"/></g>

  <!-- Labels -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#0a4277">
    <text x="60" y="60" font-weight="700">Cross-section</text>
    <text x="60" y="78" font-size="11" fill="#475569">3.5C or 4C armoured</text>

    <text x="40" y="295" font-size="11">PVC outer sheath</text>
    <line x1="120" y1="290" x2="155" y2="285" stroke="#0a4277" stroke-width="1.5"/>

    <text x="40" y="320" font-size="11">GI armouring</text>
    <line x1="120" y1="315" x2="160" y2="290" stroke="#0a4277" stroke-width="1.5"/>

    <text x="430" y="285" font-size="11">PVC inner sheath</text>
    <line x1="425" y1="280" x2="365" y2="265" stroke="#0a4277" stroke-width="1.5"/>

    <text x="430" y="320" font-size="11">XLPE / PVC insulation</text>
    <line x1="425" y1="315" x2="360" y2="285" stroke="#0a4277" stroke-width="1.5"/>

    <text x="270" y="20" text-anchor="middle" font-weight="700" font-size="13">SUPERTECH Industrial Power Cable</text>
    <text x="270" y="345" text-anchor="middle" font-size="10" fill="#475569">XLPE / PVC insulated, armoured, sheathed (per IS 1554 / IS 7098)</text>
  </g>
</svg>
