<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" role="img" aria-label="Solar PV module">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="gPanel" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#0c1d4d"/></linearGradient>
  </defs>
  <rect width="540" height="360" fill="url(#g1)"/>

  <!-- Aluminium frame -->
  <rect x="60" y="50" width="420" height="260" rx="4" fill="#9ca3af" stroke="#0a4277" stroke-width="2.5"/>
  <!-- Glass + cells -->
  <rect x="70" y="60" width="400" height="240" rx="2" fill="url(#gPanel)" stroke="#0a4277" stroke-width="1.5"/>

  <!-- Half-cut cells grid (12 columns x 6 rows) -->
  <g stroke="#3b82f6" stroke-width="1" fill="#1e40af" opacity="0.95">
    <!-- Draw a 12x6 grid of half-cells -->
    <g transform="translate(75 65)">
      <!-- Row 1-3 (top half) -->
      <g>
        <!-- 12 columns, each ~32 wide, 36 tall -->
        <rect x="0"   y="0"  width="30" height="34"/>
        <rect x="32"  y="0"  width="30" height="34"/>
        <rect x="64"  y="0"  width="30" height="34"/>
        <rect x="96"  y="0"  width="30" height="34"/>
        <rect x="128" y="0"  width="30" height="34"/>
        <rect x="160" y="0"  width="30" height="34"/>
        <rect x="192" y="0"  width="30" height="34"/>
        <rect x="224" y="0"  width="30" height="34"/>
        <rect x="256" y="0"  width="30" height="34"/>
        <rect x="288" y="0"  width="30" height="34"/>
        <rect x="320" y="0"  width="30" height="34"/>
        <rect x="352" y="0"  width="30" height="34"/>
      </g>
      <g transform="translate(0 38)">
        <rect x="0"   y="0"  width="30" height="34"/><rect x="32" y="0" width="30" height="34"/>
        <rect x="64"  y="0"  width="30" height="34"/><rect x="96" y="0" width="30" height="34"/>
        <rect x="128" y="0"  width="30" height="34"/><rect x="160" y="0" width="30" height="34"/>
        <rect x="192" y="0"  width="30" height="34"/><rect x="224" y="0" width="30" height="34"/>
        <rect x="256" y="0"  width="30" height="34"/><rect x="288" y="0" width="30" height="34"/>
        <rect x="320" y="0"  width="30" height="34"/><rect x="352" y="0" width="30" height="34"/>
      </g>
      <g transform="translate(0 76)">
        <rect x="0"   y="0"  width="30" height="34"/><rect x="32" y="0" width="30" height="34"/>
        <rect x="64"  y="0"  width="30" height="34"/><rect x="96" y="0" width="30" height="34"/>
        <rect x="128" y="0"  width="30" height="34"/><rect x="160" y="0" width="30" height="34"/>
        <rect x="192" y="0"  width="30" height="34"/><rect x="224" y="0" width="30" height="34"/>
        <rect x="256" y="0"  width="30" height="34"/><rect x="288" y="0" width="30" height="34"/>
        <rect x="320" y="0"  width="30" height="34"/><rect x="352" y="0" width="30" height="34"/>
      </g>
      <!-- Bus bar gap -->
      <g transform="translate(0 116)">
        <rect x="0"   y="0"  width="30" height="34"/><rect x="32" y="0" width="30" height="34"/>
        <rect x="64"  y="0"  width="30" height="34"/><rect x="96" y="0" width="30" height="34"/>
        <rect x="128" y="0"  width="30" height="34"/><rect x="160" y="0" width="30" height="34"/>
        <rect x="192" y="0"  width="30" height="34"/><rect x="224" y="0" width="30" height="34"/>
        <rect x="256" y="0"  width="30" height="34"/><rect x="288" y="0" width="30" height="34"/>
        <rect x="320" y="0"  width="30" height="34"/><rect x="352" y="0" width="30" height="34"/>
      </g>
      <g transform="translate(0 154)">
        <rect x="0"   y="0"  width="30" height="34"/><rect x="32" y="0" width="30" height="34"/>
        <rect x="64"  y="0"  width="30" height="34"/><rect x="96" y="0" width="30" height="34"/>
        <rect x="128" y="0"  width="30" height="34"/><rect x="160" y="0" width="30" height="34"/>
        <rect x="192" y="0"  width="30" height="34"/><rect x="224" y="0" width="30" height="34"/>
        <rect x="256" y="0"  width="30" height="34"/><rect x="288" y="0" width="30" height="34"/>
        <rect x="320" y="0"  width="30" height="34"/><rect x="352" y="0" width="30" height="34"/>
      </g>
      <g transform="translate(0 192)">
        <rect x="0"   y="0"  width="30" height="34"/><rect x="32" y="0" width="30" height="34"/>
        <rect x="64"  y="0"  width="30" height="34"/><rect x="96" y="0" width="30" height="34"/>
        <rect x="128" y="0"  width="30" height="34"/><rect x="160" y="0" width="30" height="34"/>
        <rect x="192" y="0"  width="30" height="34"/><rect x="224" y="0" width="30" height="34"/>
        <rect x="256" y="0"  width="30" height="34"/><rect x="288" y="0" width="30" height="34"/>
        <rect x="320" y="0"  width="30" height="34"/><rect x="352" y="0" width="30" height="34"/>
      </g>
    </g>
  </g>

  <!-- Bus bars (silver lines on cells) -->
  <g stroke="#cbd5e1" stroke-width="0.6" opacity="0.7">
    <line x1="75" y1="76" x2="455" y2="76"/>
    <line x1="75" y1="88" x2="455" y2="88"/>
    <line x1="75" y1="114" x2="455" y2="114"/>
    <line x1="75" y1="126" x2="455" y2="126"/>
    <line x1="75" y1="152" x2="455" y2="152"/>
    <line x1="75" y1="164" x2="455" y2="164"/>
    <line x1="75" y1="200" x2="455" y2="200"/>
    <line x1="75" y1="226" x2="455" y2="226"/>
    <line x1="75" y1="252" x2="455" y2="252"/>
    <line x1="75" y1="278" x2="455" y2="278"/>
  </g>

  <!-- Junction box -->
  <rect x="220" y="320" width="100" height="20" rx="2" fill="#0a0a0a" stroke="#0a4277" stroke-width="1.5"/>
  <rect x="195" y="335" width="10" height="20" rx="2" fill="#dc2626" stroke="#0a4277" stroke-width="1.5"/>
  <rect x="335" y="335" width="10" height="20" rx="2" fill="#1e293b" stroke="#0a4277" stroke-width="1.5"/>
  <text x="270" y="334" text-anchor="middle" font-size="8" fill="#cbd5e1" font-family="sans-serif">Junction box</text>

  <!-- Title & labels -->
  <text x="270" y="35" text-anchor="middle" font-size="14" font-weight="800" fill="#0a4277" font-family="sans-serif">SUPERTECH Solar PV Module (Mono-PERC half-cut)</text>
</svg>
