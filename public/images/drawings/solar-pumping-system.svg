<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-label="Solar pumping system schematic">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="100%" stop-color="#f8fafc"/></linearGradient>
    <linearGradient id="gPanel" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="gEarth" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#a78b6f"/><stop offset="100%" stop-color="#5a4530"/></linearGradient>
  </defs>
  <rect width="720" height="540" fill="url(#g1)"/>
  <!-- Sun -->
  <circle cx="120" cy="80" r="32" fill="#fbbf24"/>
  <g stroke="#fbbf24" stroke-width="3">
    <line x1="120" y1="20" x2="120" y2="35"/>
    <line x1="120" y1="125" x2="120" y2="140"/>
    <line x1="60" y1="80" x2="75" y2="80"/>
    <line x1="165" y1="80" x2="180" y2="80"/>
    <line x1="80" y1="40" x2="90" y2="50"/>
    <line x1="150" y1="110" x2="160" y2="120"/>
    <line x1="80" y1="120" x2="90" y2="110"/>
    <line x1="150" y1="50" x2="160" y2="40"/>
  </g>

  <!-- PV module array on tilted structure -->
  <g transform="translate(220 50)">
    <path d="M0 110 L260 30 L260 80 L0 160 Z" fill="url(#gPanel)" stroke="#0a4277" stroke-width="2"/>
    <!-- Cells grid -->
    <g stroke="#3b82f6" stroke-width="1.5" fill="none">
      <line x1="40" y1="90" x2="40" y2="155"/>
      <line x1="80" y1="78" x2="80" y2="148"/>
      <line x1="120" y1="66" x2="120" y2="138"/>
      <line x1="160" y1="54" x2="160" y2="128"/>
      <line x1="200" y1="42" x2="200" y2="118"/>
      <line x1="220" y1="36" x2="220" y2="112"/>
      <line x1="0" y1="135" x2="260" y2="50"/>
      <line x1="0" y1="115" x2="260" y2="35" stroke-opacity="0.5"/>
    </g>
    <!-- Structure legs -->
    <line x1="20" y1="155" x2="20" y2="240" stroke="#475569" stroke-width="4"/>
    <line x1="220" y1="35" x2="220" y2="240" stroke="#475569" stroke-width="4"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="370" width="720" height="170" fill="url(#gEarth)"/>
  <line x1="0" y1="370" x2="720" y2="370" stroke="#5a4530" stroke-width="2"/>

  <!-- Controller -->
  <g transform="translate(540 240)">
    <rect x="0" y="0" width="100" height="120" rx="6" fill="white" stroke="#0a4277" stroke-width="2.5"/>
    <rect x="2" y="2" width="96" height="116" rx="4" fill="#0f6cbd" opacity="0.08"/>
    <rect x="15" y="15" width="70" height="30" rx="3" fill="#0a0a0a"/>
    <text x="50" y="35" text-anchor="middle" font-size="11" font-weight="700" fill="#22c55e" font-family="monospace">050.0 Hz</text>
    <circle cx="25" cy="65" r="4" fill="#22c55e"/>
    <circle cx="50" cy="65" r="4" fill="#fbbf24"/>
    <circle cx="75" cy="65" r="4" fill="#ef4444"/>
    <rect x="20" y="80" width="60" height="30" rx="2" fill="url(#gPanel)" opacity="0.85"/>
    <text x="50" y="100" text-anchor="middle" font-size="9" font-weight="700" fill="white" font-family="sans-serif">MPPT-VFD</text>
  </g>
  <text x="590" y="380" text-anchor="middle" font-size="11" fill="#0a4277" font-weight="600" font-family="sans-serif">Solar Controller</text>

  <!-- Wires from PV to controller -->
  <g stroke="#dc2626" stroke-width="2.5" fill="none">
    <path d="M470 175 Q510 200 540 245"/>
  </g>
  <g stroke="#1e293b" stroke-width="2.5" fill="none">
    <path d="M475 185 Q515 215 545 250"/>
  </g>
  <text x="475" y="225" font-size="9" fill="#dc2626" font-family="sans-serif" font-weight="600">DC +</text>
  <text x="478" y="240" font-size="9" fill="#1e293b" font-family="sans-serif" font-weight="600">DC –</text>

  <!-- Borewell with submersible pump -->
  <rect x="100" y="370" width="60" height="170" fill="#0c4a6e" opacity="0.4"/>
  <line x1="100" y1="370" x2="100" y2="540" stroke="#0a4277" stroke-width="2.5"/>
  <line x1="160" y1="370" x2="160" y2="540" stroke="#0a4277" stroke-width="2.5"/>
  <text x="130" y="395" text-anchor="middle" font-size="10" fill="white" font-weight="600" font-family="sans-serif">BOREWELL</text>

  <!-- Submersible pump in borewell -->
  <g transform="translate(120 425)">
    <rect x="0" y="0" width="20" height="100" rx="3" fill="url(#gPanel)" stroke="#0a4277" stroke-width="1.5"/>
    <line x1="0" y1="20" x2="20" y2="20" stroke="#0a4277" stroke-width="1"/>
    <line x1="0" y1="35" x2="20" y2="35" stroke="#0a4277" stroke-width="1"/>
    <line x1="0" y1="50" x2="20" y2="50" stroke="#0a4277" stroke-width="1"/>
    <line x1="0" y1="65" x2="20" y2="65" stroke="#0a4277" stroke-width="1"/>
  </g>

  <!-- Delivery pipe up and out -->
  <line x1="130" y1="370" x2="130" y2="425" stroke="#94a3b8" stroke-width="6"/>
  <line x1="130" y1="370" x2="280" y2="370" stroke="#94a3b8" stroke-width="6"/>
  <polygon points="275,365 285,370 275,375" fill="#0ea5e9"/>
  <text x="200" y="360" text-anchor="middle" font-size="11" fill="#0a4277" font-weight="600" font-family="sans-serif">’ to tank / field</text>

  <!-- Cable from controller down to pump -->
  <path d="M540 305 Q400 320 200 340 Q150 360 140 425" stroke="#1e293b" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
  <text x="320" y="320" font-size="10" fill="#475569" font-style="italic" font-family="sans-serif">3Æ AC submersible cable</text>

  <!-- Title -->
  <text x="360" y="40" text-anchor="middle" font-size="14" font-weight="800" fill="#0a4277" font-family="sans-serif">SUPERTECH Solar Pumping System</text>
  <text x="360" y="58" text-anchor="middle" font-size="11" fill="#475569" font-family="sans-serif">PV array ’ MPPT-VFD controller ’ AC submersible pump</text>
</svg>
