<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 720" role="img" aria-label="Openwell submersible pump">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="gMotor" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#0f6cbd"/><stop offset="100%" stop-color="#062a4d"/></linearGradient>
    <linearGradient id="gPump" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#1bb6e6"/><stop offset="100%" stop-color="#0f6cbd"/></linearGradient>
    <linearGradient id="gWater" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#bae6fd" stop-opacity="0.3"/><stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.15"/></linearGradient>
  </defs>
  <rect width="320" height="720" fill="url(#g1)"/>

  <!-- Well outline -->
  <rect x="20" y="100" width="280" height="600" fill="url(#gWater)" stroke="#1e293b" stroke-width="2"/>
  <text x="40" y="130" font-family="sans-serif" font-size="10" fill="#475569" font-style="italic">water level ’</text>
  <line x1="20" y1="180" x2="300" y2="180" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 4"/>

  <g fill="none" stroke="#0a4277" stroke-width="2.5">
    <!-- Outlet pipe from top -->
    <line x1="180" y1="50" x2="180" y2="280" stroke-width="6"/>
    <rect x="165" y="40" width="30" height="20" rx="2"/>
    <text x="220" y="55" font-family="sans-serif" font-size="11" fill="#0a4277">Delivery</text>

    <!-- Pump body (compact) -->
    <rect x="100" y="290" width="120" height="160" rx="10"/>
    <line x1="100" y1="335" x2="220" y2="335"/>
    <line x1="100" y1="370" x2="220" y2="370"/>
    <line x1="100" y1="405" x2="220" y2="405"/>

    <!-- Suction inlet -->
    <path d="M110 450 L100 470 L220 470 L210 450 Z"/>
    <g stroke="#0a4277" stroke-width="1.5">
      <line x1="118" y1="455" x2="125" y2="468"/>
      <line x1="138" y1="455" x2="145" y2="468"/>
      <line x1="158" y1="455" x2="165" y2="468"/>
      <line x1="178" y1="455" x2="185" y2="468"/>
      <line x1="198" y1="455" x2="205" y2="468"/>
    </g>

    <!-- Motor section (below pump) -->
    <rect x="100" y="478" width="120" height="180" rx="10"/>

    <!-- Base feet -->
    <rect x="85" y="660" width="150" height="14" rx="2"/>
    <line x1="105" y1="674" x2="105" y2="690"/>
    <line x1="215" y1="674" x2="215" y2="690"/>
  </g>

  <rect x="103" y="293" width="114" height="154" rx="8" fill="url(#gPump)" opacity="0.12"/>
  <rect x="103" y="481" width="114" height="174" rx="8" fill="url(#gMotor)" opacity="0.14"/>

  <!-- Cable -->
  <path d="M65 350 Q45 450 65 550 Q45 640 65 680" stroke="#0a4277" stroke-width="2" fill="none"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0a4277">
    <text x="230" y="320">Single/multi-stage</text>
    <text x="230" y="335">pump section</text>
    <text x="230" y="375">Impeller</text>
    <text x="230" y="460">SS strainer</text>
    <text x="230" y="545">Sealed motor</text>
    <text x="230" y="560" fill="#475569" font-size="10">TEFC equivalent</text>
    <text x="230" y="675">Mounting feet</text>
    <text x="40" y="350" font-size="10">Power</text>
    <text x="40" y="363" font-size="10">cable</text>
    <text x="20" y="710" font-weight="700" font-size="11">SUPERTECH Openwell Submersible Pump</text>
  </g>
</svg>
