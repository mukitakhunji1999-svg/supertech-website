  <circle cx="270" cy="180" r="92" fill="url(#gValve)" opacity="0.14"/>
  <ellipse cx="270" cy="180" rx="92" ry="22" fill="url(#gValve)" opacity="0.4"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#0a4277">
