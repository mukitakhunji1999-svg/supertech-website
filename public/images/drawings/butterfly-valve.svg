<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" role="img" aria-label="Butterfly valve cross-section">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="gValve" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#0f6cbd"/><stop offset="100%" stop-color="#062a4d"/></linearGradient>
  </defs>
  <rect width="540" height="360" fill="url(#g1)"/>
  <g fill="none" stroke="#0a4277" stroke-width="2.5">
    <circle cx="270" cy="180" r="120"/>
    <circle cx="270" cy="180" r="95"/>
    <ellipse cx="270" cy="180" rx="92" ry="22"/>
    <line x1="178" y1="180" x2="362" y2="180"/>
    <line x1="270" y1="60" x2="270" y2="20" stroke-width="6"/>
    <rect x="245" y="20" width="50" height="50" rx="4"/>
    <line x1="252" y1="35" x2="288" y2="35"/>
    <line x1="252" y1="50" x2="288" y2="50"/>
    <line x1="178" y1="105" x2="362" y2="105" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 4"/>
    <line x1="178" y1="255" x2="362" y2="255" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 4"/>
    <g stroke="#0a4277" stroke-width="2">
