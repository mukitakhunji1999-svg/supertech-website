<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" role="img" aria-label="Centrifugal monoblock pump — side view">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="gMotor" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#0f6cbd"/><stop offset="100%" stop-color="#062a4d"/></linearGradient>
    <linearGradient id="gPump" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#1bb6e6"/><stop offset="100%" stop-color="#0f6cbd"/></linearGradient>
  </defs>
  <rect width="540" height="360" fill="url(#g1)"/>

  <g fill="none" stroke="#0a4277" stroke-width="2.5">
    <!-- Motor body (left, larger cylinder) -->
    <rect x="40" y="100" width="260" height="180" rx="14"/>
    <!-- Motor cooling fins (vertical lines) -->
    <line x1="60" y1="115" x2="60" y2="265"/>
    <line x1="85" y1="115" x2="85" y2="265"/>
    <line x1="110" y1="115" x2="110" y2="265"/>
    <line x1="135" y1="115" x2="135" y2="265"/>
    <line x1="160" y1="115" x2="160" y2="265"/>
    <line x1="185" y1="115" x2="185" y2="265"/>
    <line x1="210" y1="115" x2="210" y2="265"/>
    <line x1="235" y1="115" x2="235" y2="265"/>
    <line x1="260" y1="115" x2="260" y2="265"/>

    <!-- Fan cover (left) -->
    <rect x="20" y="115" width="20" height="150" rx="4"/>
    <line x1="25" y1="135" x2="35" y2="135"/>
    <line x1="25" y1="160" x2="35" y2="160"/>
    <line x1="25" y1="185" x2="35" y2="185"/>
    <line x1="25" y1="210" x2="35" y2="210"/>
    <line x1="25" y1="235" x2="35" y2="235"/>

    <!-- Terminal box (top of motor) -->
    <rect x="120" y="70" width="100" height="35" rx="4"/>
    <circle cx="170" cy="87" r="4"/>

    <!-- Pump casing (right, volute shape) -->
    <path d="M300 100 L380 100 Q440 100 460 165 Q440 230 380 230 L320 230 L300 280 L300 100 Z"/>
    <!-- Impeller chamber circle -->
    <circle cx="385" cy="170" r="55" stroke-width="2"/>
    <!-- Suction inlet (front, perpendicular) -->
    <rect x="375" y="60" width="40" height="50" rx="4"/>
    <!-- Delivery outlet (right side, perpendicular) -->
    <rect x="480" y="155" width="40" height="40" rx="4"/>

    <!-- Base (feet) -->
    <rect x="30" y="285" width="475" height="22" rx="3"/>
    <rect x="60" y="307" width="40" height="20" rx="3"/>
    <rect x="240" y="307" width="40" height="20" rx="3"/>
    <rect x="430" y="307" width="40" height="20" rx="3"/>
    <line x1="80" y1="327" x2="80" y2="340" stroke-width="2"/>
    <line x1="260" y1="327" x2="260" y2="340" stroke-width="2"/>
    <line x1="450" y1="327" x2="450" y2="340" stroke-width="2"/>
  </g>

  <rect x="42" y="102" width="256" height="176" rx="12" fill="url(#gMotor)" opacity="0.14"/>
  <path d="M302 102 L378 102 Q438 102 458 165 Q438 228 378 228 L322 228 L302 278 L302 102 Z" fill="url(#gPump)" opacity="0.12"/>

  <!-- Shaft -->
  <line x1="40" y1="190" x2="385" y2="170" stroke="#0a4277" stroke-width="2" stroke-dasharray="3 3"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#0a4277">
    <text x="50" y="335" font-size="10">Foot</text>
    <text x="40" y="98">Fan cover</text>
    <text x="120" y="60">Terminal box</text>
    <text x="160" y="350" text-anchor="middle" font-weight="600">Electric motor (TEFC)</text>
    <text x="395" y="50">Suction</text>
    <text x="480" y="148">Delivery</text>
    <text x="380" y="350" text-anchor="middle" font-weight="600">Pump volute + impeller</text>

    <text x="270" y="345" text-anchor="middle" font-weight="700" font-size="13">SUPERTECH Centrifugal Monoblock Pump</text>
  </g>
</svg>
