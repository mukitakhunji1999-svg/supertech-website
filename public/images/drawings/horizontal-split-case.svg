<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Horizontal split-case pump">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="gMotor" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#0f6cbd"/><stop offset="100%" stop-color="#062a4d"/></linearGradient>
    <linearGradient id="gPump" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#1bb6e6"/><stop offset="100%" stop-color="#0f6cbd"/></linearGradient>
  </defs>
  <rect width="720" height="360" fill="url(#g1)"/>

  <g fill="none" stroke="#0a4277" stroke-width="2.5">
    <!-- Baseplate -->
    <rect x="30" y="270" width="660" height="30" rx="3"/>
    <rect x="80" y="300" width="40" height="20" rx="2"/>
    <rect x="270" y="300" width="40" height="20" rx="2"/>
    <rect x="430" y="300" width="40" height="20" rx="2"/>
    <rect x="590" y="300" width="40" height="20" rx="2"/>

    <!-- Motor (right) -->
    <rect x="420" y="110" width="220" height="160" rx="14"/>
    <line x1="440" y1="125" x2="440" y2="255"/>
    <line x1="460" y1="125" x2="460" y2="255"/>
    <line x1="480" y1="125" x2="480" y2="255"/>
    <line x1="500" y1="125" x2="500" y2="255"/>
    <line x1="520" y1="125" x2="520" y2="255"/>
    <line x1="540" y1="125" x2="540" y2="255"/>
    <line x1="560" y1="125" x2="560" y2="255"/>
    <line x1="580" y1="125" x2="580" y2="255"/>
    <line x1="600" y1="125" x2="600" y2="255"/>
    <line x1="620" y1="125" x2="620" y2="255"/>
    <rect x="490" y="85" width="80" height="30" rx="3"/>
    <rect x="395" y="125" width="25" height="130" rx="3"/>

    <!-- Coupling guard -->
    <rect x="370" y="170" width="50" height="50" rx="4"/>

    <!-- Pump (left, with split-case lines visible) -->
    <ellipse cx="220" cy="195" rx="140" ry="80"/>
    <!-- Split line (horizontal) -->
    <line x1="80" y1="195" x2="360" y2="195" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- Bolts along split flange -->
    <g fill="#0a4277">
      <circle cx="100" cy="195" r="3"/>
      <circle cx="130" cy="195" r="3"/>
      <circle cx="160" cy="195" r="3"/>
      <circle cx="190" cy="195" r="3"/>
      <circle cx="220" cy="195" r="3"/>
      <circle cx="250" cy="195" r="3"/>
      <circle cx="280" cy="195" r="3"/>
      <circle cx="310" cy="195" r="3"/>
      <circle cx="340" cy="195" r="3"/>
    </g>
    <!-- Impeller centre -->
    <circle cx="220" cy="195" r="35"/>
    <!-- Double suction (front) -->
    <rect x="100" y="80" width="60" height="50" rx="3"/>
    <line x1="130" y1="130" x2="130" y2="195" stroke-width="6"/>
    <!-- Delivery (top) -->
    <rect x="240" y="60" width="60" height="40" rx="3"/>
    <line x1="270" y1="100" x2="270" y2="195" stroke-width="6"/>
  </g>

  <ellipse cx="220" cy="195" rx="138" ry="78" fill="url(#gPump)" opacity="0.14"/>
  <circle cx="220" cy="195" r="33" fill="url(#gPump)" opacity="0.35"/>
  <rect x="422" y="112" width="216" height="156" rx="12" fill="url(#gMotor)" opacity="0.14"/>

  <!-- Shaft (dashed line through both) -->
  <line x1="100" y1="195" x2="640" y2="195" stroke="#0a4277" stroke-width="1.5" stroke-dasharray="3 3"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#0a4277">
    <text x="130" y="60" text-anchor="middle">Suction (double)</text>
    <text x="270" y="50" text-anchor="middle">Delivery</text>
    <text x="220" y="290" text-anchor="middle" font-weight="700">Pump (split case)</text>
    <text x="530" y="290" text-anchor="middle" font-weight="700">Electric Motor</text>
    <text x="395" y="160" font-size="9" fill="#dc2626" font-style="italic">Coupling</text>
    <text x="40" y="200" font-size="9" fill="#dc2626" font-style="italic">Split line</text>
    <text x="360" y="345" text-anchor="middle" font-weight="700" font-size="13">SUPERTECH Horizontal Split-Case Pump</text>
  </g>
</svg>
