<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" role="img" aria-label="3-phase squirrel cage induction motor — side view">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="gMotor" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#0f6cbd"/><stop offset="100%" stop-color="#062a4d"/></linearGradient>
  </defs>
  <rect width="540" height="360" fill="url(#g1)"/>

  <g fill="none" stroke="#0a4277" stroke-width="2.5">
    <!-- Motor body -->
    <rect x="80" y="105" width="320" height="180" rx="14"/>
    <!-- Cooling fins -->
    <line x1="100" y1="120" x2="100" y2="270"/>
    <line x1="125" y1="120" x2="125" y2="270"/>
    <line x1="150" y1="120" x2="150" y2="270"/>
    <line x1="175" y1="120" x2="175" y2="270"/>
    <line x1="200" y1="120" x2="200" y2="270"/>
    <line x1="225" y1="120" x2="225" y2="270"/>
    <line x1="250" y1="120" x2="250" y2="270"/>
    <line x1="275" y1="120" x2="275" y2="270"/>
    <line x1="300" y1="120" x2="300" y2="270"/>
    <line x1="325" y1="120" x2="325" y2="270"/>
    <line x1="350" y1="120" x2="350" y2="270"/>
    <line x1="375" y1="120" x2="375" y2="270"/>

    <!-- Fan cover (left side) -->
    <rect x="50" y="125" width="30" height="140" rx="4"/>
    <g stroke-width="1.5">
      <line x1="60" y1="140" x2="70" y2="140"/>
      <line x1="60" y1="160" x2="70" y2="160"/>
      <line x1="60" y1="180" x2="70" y2="180"/>
      <line x1="60" y1="200" x2="70" y2="200"/>
      <line x1="60" y1="220" x2="70" y2="220"/>
      <line x1="60" y1="240" x2="70" y2="240"/>
    </g>

    <!-- Terminal box -->
    <rect x="200" y="75" width="100" height="35" rx="4"/>
    <circle cx="225" cy="92" r="3"/>
    <circle cx="250" cy="92" r="3"/>
    <circle cx="275" cy="92" r="3"/>

    <!-- Shaft (right side, out of motor) -->
    <rect x="400" y="178" width="80" height="30" rx="3"/>
    <line x1="455" y1="178" x2="455" y2="208"/>
    <line x1="465" y1="178" x2="465" y2="208"/>

    <!-- Base / feet -->
    <rect x="100" y="285" width="280" height="22" rx="3"/>
    <rect x="120" y="307" width="40" height="20" rx="3"/>
    <rect x="320" y="307" width="40" height="20" rx="3"/>
    <line x1="140" y1="327" x2="140" y2="340" stroke-width="2"/>
    <line x1="340" y1="327" x2="340" y2="340" stroke-width="2"/>
  </g>

  <rect x="82" y="107" width="316" height="176" rx="12" fill="url(#gMotor)" opacity="0.14"/>

  <!-- Shaft centerline -->
  <line x1="50" y1="195" x2="490" y2="193" stroke="#0a4277" stroke-width="2" stroke-dasharray="3 3"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#0a4277">
    <text x="55" y="120">Fan cover</text>
    <text x="200" y="65" font-weight="600">Terminal box (3-phase)</text>
    <text x="240" y="355" text-anchor="middle" font-weight="600">Motor frame (TEFC, IP55)</text>
    <text x="415" y="172">Output shaft</text>
    <text x="415" y="186" font-size="10" fill="#475569">with keyway</text>
    <text x="130" y="348" font-size="10">Foot</text>
    <text x="270" y="20" text-anchor="middle" font-weight="700" font-size="13">SUPERTECH 3-Phase Induction Motor</text>
  </g>
</svg>
