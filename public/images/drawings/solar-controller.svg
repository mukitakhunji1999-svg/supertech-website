<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" aria-label="Solar pump controller">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="gPanel" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#0f6cbd"/><stop offset="100%" stop-color="#062a4d"/></linearGradient>
  </defs>
  <rect width="540" height="540" fill="url(#g1)"/>

  <!-- Outer enclosure -->
  <rect x="100" y="60" width="340" height="420" rx="10" fill="white" stroke="#0a4277" stroke-width="3"/>
  <rect x="102" y="62" width="336" height="416" rx="8" fill="url(#gPanel)" opacity="0.06"/>

  <!-- IP65 vents on top -->
  <g stroke="#0a4277" stroke-width="1.5">
    <line x1="140" y1="50" x2="160" y2="50"/>
    <line x1="170" y1="50" x2="190" y2="50"/>
    <line x1="200" y1="50" x2="220" y2="50"/>
    <line x1="230" y1="50" x2="250" y2="50"/>
    <line x1="280" y1="50" x2="300" y2="50"/>
    <line x1="310" y1="50" x2="330" y2="50"/>
    <line x1="340" y1="50" x2="360" y2="50"/>
    <line x1="370" y1="50" x2="390" y2="50"/>
  </g>

  <!-- Display -->
  <rect x="140" y="100" width="260" height="120" rx="6" fill="#0a0a0a" stroke="#0a4277" stroke-width="2"/>
  <text x="270" y="135" text-anchor="middle" font-size="13" fill="#22c55e" font-family="monospace" font-weight="700">DC IN: 580 V</text>
  <text x="270" y="160" text-anchor="middle" font-size="13" fill="#22c55e" font-family="monospace" font-weight="700">AC OUT: 415 V / 48.5 Hz</text>
  <text x="270" y="185" text-anchor="middle" font-size="13" fill="#fbbf24" font-family="monospace" font-weight="700">POWER: 5.2 kW</text>
  <text x="270" y="208" text-anchor="middle" font-size="11" fill="#3b82f6" font-family="monospace">MPPT: 98.7%</text>

  <!-- LED indicators -->
  <circle cx="160" cy="260" r="9" fill="#22c55e" stroke="#0a4277" stroke-width="1.5"/>
  <text x="160" y="285" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">RUN</text>
  <circle cx="210" cy="260" r="9" fill="#fbbf24" stroke="#0a4277" stroke-width="1.5"/>
  <text x="210" y="285" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">MPPT</text>
  <circle cx="270" cy="260" r="9" fill="#3b82f6" stroke="#0a4277" stroke-width="1.5"/>
  <text x="270" y="285" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">DC ON</text>
  <circle cx="330" cy="260" r="9" fill="#9ca3af" stroke="#0a4277" stroke-width="1.5"/>
  <text x="330" y="285" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">FAULT</text>
  <circle cx="380" cy="260" r="9" fill="#9ca3af" stroke="#0a4277" stroke-width="1.5"/>
  <text x="380" y="285" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">DRY</text>

  <!-- Keypad -->
  <g>
    <rect x="160" y="305" width="40" height="40" rx="4" fill="#22c55e" stroke="#0a4277" stroke-width="1.5"/>
    <text x="180" y="330" text-anchor="middle" font-size="10" font-weight="700" fill="white" font-family="sans-serif">START</text>
    <rect x="210" y="305" width="40" height="40" rx="4" fill="#ef4444" stroke="#0a4277" stroke-width="1.5"/>
    <text x="230" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="white" font-family="sans-serif">STOP</text>
    <rect x="260" y="305" width="40" height="40" rx="4" fill="#fbbf24" stroke="#0a4277" stroke-width="1.5"/>
    <text x="280" y="330" text-anchor="middle" font-size="10" font-weight="700" fill="white" font-family="sans-serif">RSET</text>
    <rect x="310" y="305" width="40" height="40" rx="4" fill="#e2e8f0" stroke="#0a4277" stroke-width="1.5"/>
    <text x="330" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#0a4277" font-family="sans-serif">‘</text>
    <rect x="360" y="305" width="40" height="40" rx="4" fill="#e2e8f0" stroke="#0a4277" stroke-width="1.5"/>
    <text x="380" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#0a4277" font-family="sans-serif">“</text>
  </g>

  <!-- Brand badge -->
  <rect x="170" y="385" width="200" height="50" rx="4" fill="url(#gPanel)" opacity="0.9"/>
  <text x="270" y="412" text-anchor="middle" font-size="14" font-weight="800" fill="white" font-family="sans-serif">SUPERTECH</text>
  <text x="270" y="428" text-anchor="middle" font-size="8" fill="#bae6fd" font-family="sans-serif" letter-spacing="2">SOLAR MPPT-VFD</text>

  <!-- Cable glands -->
  <circle cx="160" cy="470" r="8" fill="#cbd5e1" stroke="#0a4277" stroke-width="2"/>
  <circle cx="220" cy="470" r="8" fill="#cbd5e1" stroke="#0a4277" stroke-width="2"/>
  <circle cx="320" cy="470" r="8" fill="#cbd5e1" stroke="#0a4277" stroke-width="2"/>
  <circle cx="380" cy="470" r="8" fill="#cbd5e1" stroke="#0a4277" stroke-width="2"/>
  <text x="190" y="500" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">DC inputs</text>
  <text x="350" y="500" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">AC outputs</text>

  <text x="270" y="535" text-anchor="middle" font-size="10" fill="#475569" font-family="sans-serif">IP65 outdoor enclosure</text>
</svg>
