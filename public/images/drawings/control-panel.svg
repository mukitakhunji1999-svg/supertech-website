<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" role="img" aria-label="Control panel layout">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="gPanel" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#0f6cbd"/><stop offset="100%" stop-color="#062a4d"/></linearGradient>
  </defs>
  <rect width="540" height="540" fill="url(#g1)"/>

  <!-- Outer enclosure -->
  <rect x="80" y="40" width="380" height="460" rx="8" fill="white" stroke="#0a4277" stroke-width="3"/>
  <rect x="82" y="42" width="376" height="456" rx="6" fill="url(#gPanel)" opacity="0.06"/>
  <!-- Door hinges -->
  <circle cx="82" cy="80" r="4" fill="#0a4277"/>
  <circle cx="82" cy="270" r="4" fill="#0a4277"/>
  <circle cx="82" cy="460" r="4" fill="#0a4277"/>
  <!-- Door handle/lock -->
  <rect x="448" y="260" width="20" height="40" rx="3" fill="#0a4277"/>

  <!-- Display section -->
  <rect x="120" y="80" width="300" height="100" rx="4" fill="white" stroke="#0a4277" stroke-width="2"/>
  <!-- Voltmeter -->
  <circle cx="170" cy="130" r="32" fill="white" stroke="#0a4277" stroke-width="2"/>
  <text x="170" y="125" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">VOLTS</text>
  <text x="170" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0a4277" font-family="sans-serif">415</text>
  <!-- Ammeter -->
  <circle cx="270" cy="130" r="32" fill="white" stroke="#0a4277" stroke-width="2"/>
  <text x="270" y="125" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">AMPS</text>
  <text x="270" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0a4277" font-family="sans-serif">8.5</text>
  <!-- Hour meter -->
  <rect x="345" y="110" width="60" height="40" rx="3" fill="#0a0a0a" stroke="#0a4277" stroke-width="1.5"/>
  <text x="375" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="#fbbf24" font-family="monospace">001234</text>

  <!-- Indicator lights -->
  <circle cx="135" cy="210" r="8" fill="#ef4444" stroke="#0a4277" stroke-width="1.5"/>
  <text x="135" y="232" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">R</text>
  <circle cx="165" cy="210" r="8" fill="#eab308" stroke="#0a4277" stroke-width="1.5"/>
  <text x="165" y="232" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">Y</text>
  <circle cx="195" cy="210" r="8" fill="#3b82f6" stroke="#0a4277" stroke-width="1.5"/>
  <text x="195" y="232" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">B</text>
  <circle cx="245" cy="210" r="8" fill="#22c55e" stroke="#0a4277" stroke-width="1.5"/>
  <text x="245" y="232" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">ON</text>
  <circle cx="280" cy="210" r="8" fill="#fb923c" stroke="#0a4277" stroke-width="1.5"/>
  <text x="280" y="232" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">TRIP</text>

  <!-- Selector & buttons -->
  <circle cx="360" cy="215" r="22" fill="white" stroke="#0a4277" stroke-width="2"/>
  <line x1="360" y1="195" x2="360" y2="215" stroke="#0a4277" stroke-width="3"/>
  <text x="360" y="255" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">A / M / OFF</text>
  
  <!-- Start/Stop buttons -->
  <circle cx="170" cy="320" r="22" fill="#22c55e" stroke="#0a4277" stroke-width="2"/>
  <text x="170" y="325" text-anchor="middle" font-size="11" fill="white" font-weight="700" font-family="sans-serif">START</text>
  <circle cx="270" cy="320" r="22" fill="#ef4444" stroke="#0a4277" stroke-width="2"/>
  <text x="270" y="325" text-anchor="middle" font-size="11" fill="white" font-weight="700" font-family="sans-serif">STOP</text>
  <circle cx="370" cy="320" r="22" fill="#eab308" stroke="#0a4277" stroke-width="2"/>
  <text x="370" y="325" text-anchor="middle" font-size="10" fill="white" font-weight="700" font-family="sans-serif">RESET</text>

  <!-- Brand badge -->
  <rect x="160" y="390" width="220" height="60" rx="4" fill="url(#gPanel)" opacity="0.85"/>
  <text x="270" y="420" text-anchor="middle" font-size="16" font-weight="800" fill="white" font-family="sans-serif">SUPERTECH</text>
  <text x="270" y="438" text-anchor="middle" font-size="10" fill="#bae6fd" font-family="sans-serif" letter-spacing="2">WATER SOLUTION</text>

  <!-- Cable entry (bottom) -->
  <rect x="180" y="498" width="180" height="20" rx="2" fill="#cbd5e1" stroke="#0a4277" stroke-width="1.5"/>
  <circle cx="215" cy="510" r="6" fill="#0a4277"/>
  <circle cx="245" cy="510" r="6" fill="#0a4277"/>
  <circle cx="275" cy="510" r="6" fill="#0a4277"/>
  <circle cx="305" cy="510" r="6" fill="#0a4277"/>
  <circle cx="335" cy="510" r="6" fill="#0a4277"/>
  <text x="270" y="535" text-anchor="middle" font-size="9" fill="#475569" font-family="sans-serif">Cable gland plate</text>
</svg>
